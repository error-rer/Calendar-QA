<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" width="720" height="590" role="img" aria-labelledby="t d">
  <title id="t">UTAC QA Calendar architecture</title>
  <desc id="d">The browser runs the React app and keeps a localStorage snapshot as a cache. It calls the Cloudflare Worker over same-origin HTTPS. The Worker checks the session, serves the built app, and reads and writes Cloudflare D1 with bound SQL. Releases use npm run deploy, which applies pending D1 migrations and then deploys the Worker; npm run migrate:remote applies migrations alone.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15191e"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f665e"/>
    </marker>
    <style>
      .sans{font-family:Archivo,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
      .lab{font-size:12px;letter-spacing:1px;fill:#5f665e}
      .ink{fill:#15191e}
      .dim{fill:#4a5048}
      .w{fill:#ffffff}
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="589" rx="14" fill="#f4f6f1" stroke="#d8dcd4"/>
  <text x="20" y="34" class="sans ink" font-size="16" font-weight="700">Runtime architecture</text>
  <text x="700" y="34" text-anchor="end" class="mono lab">SOLID = RUNTIME · DASHED = RELEASE</text>

  <!-- Browser -->
  <rect x="20" y="52" width="420" height="190" rx="12" fill="#ffffff" stroke="#d8dcd4"/>
  <text x="38" y="80" class="mono lab">BROWSER · EDGE / CHROME</text>
  <text x="38" y="104" class="sans ink" font-size="16" font-weight="600">React 19 single-page app</text>
  <rect x="34" y="118" width="392" height="32" rx="8" fill="#f1f3ee"/>
  <text x="48" y="139" class="mono ink" font-size="13">src/components/</text>
  <text x="412" y="139" text-anchor="end" class="sans dim" font-size="13">screens</text>
  <rect x="34" y="156" width="392" height="32" rx="8" fill="#f1f3ee"/>
  <text x="48" y="177" class="mono ink" font-size="13">src/useScheduler.ts</text>
  <text x="412" y="177" text-anchor="end" class="sans dim" font-size="13">state · rules · actions</text>
  <rect x="34" y="194" width="392" height="32" rx="8" fill="#f1f3ee"/>
  <text x="48" y="215" class="mono ink" font-size="13">src/api.ts</text>
  <text x="412" y="215" text-anchor="end" class="sans dim" font-size="13">/api/* client</text>

  <!-- Snapshot cache -->
  <rect x="500" y="52" width="200" height="190" rx="12" fill="#ffffff" stroke="#d8dcd4"/>
  <text x="516" y="80" class="mono lab">LOCALSTORAGE</text>
  <text x="516" y="104" class="sans ink" font-size="16" font-weight="600">Snapshot cache</text>
  <text x="516" y="140" class="mono ink" font-size="13">calendar_qa_</text>
  <text x="516" y="158" class="mono ink" font-size="13">snapshot</text>
  <text x="516" y="194" class="sans dim" font-size="13">A cache only. Not</text>
  <text x="516" y="212" class="sans dim" font-size="13">proof that a save</text>
  <text x="516" y="230" class="sans dim" font-size="13">reached D1.</text>
  <line x1="444" y1="147" x2="496" y2="147" stroke="#15191e" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Browser to Worker -->
  <line x1="230" y1="246" x2="230" y2="292" stroke="#15191e" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="244" y="274" class="mono ink" font-size="13">HTTPS · same origin · /api/*</text>

  <!-- Worker -->
  <rect x="20" y="296" width="420" height="180" rx="12" fill="#15191e"/>
  <text x="38" y="324" class="mono lab" style="fill:#c3c8bf">CLOUDFLARE WORKER</text>
  <text x="38" y="348" class="mono w" font-size="16">worker/index.ts</text>
  <rect x="34" y="362" width="392" height="30" rx="8" fill="#2b3134"/>
  <text x="48" y="382" class="sans w" font-size="13">Session check</text>
  <text x="412" y="382" text-anchor="end" class="mono" font-size="13" fill="#d5d9d1">qa_session cookie</text>
  <rect x="34" y="398" width="392" height="30" rx="8" fill="#2b3134"/>
  <text x="48" y="418" class="sans w" font-size="13">API routes</text>
  <text x="412" y="418" text-anchor="end" class="mono" font-size="13" fill="#d5d9d1">/api/*</text>
  <rect x="34" y="434" width="392" height="30" rx="8" fill="#2b3134"/>
  <text x="48" y="454" class="sans w" font-size="13">Static app</text>
  <text x="412" y="454" text-anchor="end" class="mono" font-size="13" fill="#d5d9d1">dist · ASSETS</text>

  <!-- Worker to D1 -->
  <line x1="444" y1="400" x2="496" y2="400" stroke="#15191e" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="470" y="390" text-anchor="middle" class="mono ink" font-size="13">SQL</text>

  <!-- D1 -->
  <path d="M500,314 v146 a100,15 0 0 0 200,0 v-146" fill="#ffffff" stroke="#d8dcd4"/>
  <ellipse cx="600" cy="314" rx="100" ry="15" fill="#eef1ea" stroke="#d8dcd4"/>
  <text x="600" y="352" text-anchor="middle" class="mono lab">CLOUDFLARE D1</text>
  <text x="600" y="376" text-anchor="middle" class="mono ink" font-size="15">calendar-qa-db</text>
  <text x="600" y="398" text-anchor="middle" class="sans dim" font-size="13">binding DB · SQLite</text>
  <text x="600" y="424" text-anchor="middle" class="mono dim" font-size="12">assignments · orders</text>
  <text x="600" y="442" text-anchor="middle" class="mono dim" font-size="12">engineers · holidays</text>
  <text x="600" y="460" text-anchor="middle" class="mono dim" font-size="12">users · sessions · …</text>

  <!-- Release lane -->
  <rect x="20" y="512" width="680" height="58" rx="12" fill="none" stroke="#8a9088" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="38" y="536" class="mono lab">IT-CONTROLLED CHECKOUT</text>
  <text x="38" y="557" class="mono ink" font-size="13">npm run deploy → D1 migrations, then Worker</text>
  <text x="684" y="557" text-anchor="end" class="mono ink" font-size="13">migrate:remote → D1 only</text>
  <line x1="300" y1="510" x2="300" y2="481" stroke="#5f665e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <line x1="600" y1="510" x2="600" y2="479" stroke="#5f665e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g)"/>
</svg>
